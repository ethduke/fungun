name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test guardrails
        run: node --test scripts/check-repository.test.mjs
      - name: Audit tracked files
        run: node scripts/check-repository.mjs --tracked
      - name: Audit tested commit and ancestor history
        run: node scripts/check-repository.mjs --history-current
      - name: Install pinned independent scanner
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_dir/gitleaks.tar.gz"
          # SHA-256 from the official v8.30.1 release asset metadata.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          echo "$scan_dir" >> "$GITHUB_PATH"
      - name: Test independent scanner rules and redaction
        run: |
          gitleaks version
          node --test scripts/check-gitleaks.test.mjs
      - name: Independent redacted history scan
        run: gitleaks git --config=.gitleaks.toml --log-opts=--all --redact=100 --ignore-gitleaks-allow --no-banner .
