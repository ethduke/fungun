name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test guardrails
        run: node --test scripts/check-repository.test.mjs
      - name: Audit tracked files
        run: node scripts/check-repository.mjs --tracked
      - name: Audit reachable history
        run: node scripts/check-repository.mjs --history
