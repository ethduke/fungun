name: Webview checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
            apps/facilitator/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/api ci --ignore-scripts
      - run: npm --prefix apps/facilitator ci --ignore-scripts
      - run: npm test
      - run: npm --prefix apps/facilitator test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm --prefix apps/web audit --audit-level=high
      - run: npm --prefix apps/facilitator audit --audit-level=high
