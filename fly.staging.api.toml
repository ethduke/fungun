app = "farmgun-staging-api"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/api/Dockerfile"

[processes]
  app = "node src/staging-server.mjs"

[env]
  NODE_ENV = "production"
  FUNGUN_STAGING = "mock"
  APP_ORIGIN = "https://farmgun-staging-web.fly.dev"

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
