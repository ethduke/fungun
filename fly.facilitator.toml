# Dedicated authenticated x402 facilitator. Pass its Fly app identity using -a.
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/facilitator/Dockerfile"

[env]
  NODE_ENV = "production"

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

  [[http_service.checks]]
    interval = "30s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
